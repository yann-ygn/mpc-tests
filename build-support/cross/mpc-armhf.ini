# uv sync --locked supplies this interpreter and Zig 0.14.1.
[constants]
zig = ['@DIRNAME@' / '..' / '..' / '.venv' / 'bin' / 'python', '-m', 'ziglang']

[binaries]
c = zig + ['cc', '-target', 'arm-linux-gnueabihf.2.31', '-mcpu=cortex_a7']
ar = zig + ['ar']
pkg-config = 'false'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'cortex-a7'
endian = 'little'

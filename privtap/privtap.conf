# privtap settings (key=value; this file sits next to privtap.so). Changes apply within a second, except inject.
# Log every byte MPC reads from the controller's ports (the hardware) and writes to them (LEDs and other feedback):
# 1 on, 0 only opens, closes and errors.
log=1
log_path=/tmp/privtap.log
# Past this size the log moves to <log_path>.1 and a new one starts. /tmp is in RAM on these devices.
log_max_kb=4096
# MIDI written to this FIFO reaches MPC as if the hardware had sent it on the "... Private" port (a button: 90 nn 7F,
# then 90 nn 00). The MPC Remote addin writes here when the device has no "Virtual RawMIDI" port. none: off.
# Read when MPC starts.
inject=/dev/midi_inject

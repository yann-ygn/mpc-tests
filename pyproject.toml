[project]
name = "mpc-build-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "ruff==0.17.0",
  "ziglang==0.14.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "builddir"]

[tool.ruff.format]
line-ending = "lf"
